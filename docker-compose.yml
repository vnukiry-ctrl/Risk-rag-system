# Milestone 6.3 (Docker containerization). Two services -- backend and
# frontend are this project's own app; Qdrant runs embedded inside the
# backend process (vector_store.py's deliberate choice, see that file), not
# as a separate container, and Ollama stays a host-level dependency (see
# OLLAMA_BASE_URL below) rather than a service here.
#
# First run: `docker compose up --build`, then POST /extract (via the
# Swagger UI at http://localhost:8000/docs, or the frontend's Extract page)
# to populate the index -- same as any fresh checkout, containerized or not.
#
# Gotcha: documents_db.json is bind-mounted as a single file below. Docker
# will happily create a *directory* with that name instead if the file
# doesn't already exist on the host before the first `up` -- run
# `echo {} > backend/documents_db.json` once beforehand to avoid that.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # host.docker.internal resolves to the host machine from inside a
      # container (Docker Desktop on Windows/Mac; on Linux this needs
      # `extra_hosts: ["host.docker.internal:host-gateway"]` added below if
      # Ollama runs on the Linux host itself rather than in its own container).
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./backend/data:/app/data
      - ./backend/qdrant_data:/app/qdrant_data
      - ./backend/documents_db.json:/app/documents_db.json
      - ./backend/feedback_log.jsonl:/app/feedback_log.jsonl
      - ./backend/experiments_log.jsonl:/app/experiments_log.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    env_file:
      - ./frontend/.env
    environment:
      # Reach the backend by its compose service name, not localhost --
      # "localhost" inside the frontend container means the frontend
      # container itself.
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
