# Milestone 6.3 (Docker containerization). Two services -- backend and
# frontend are this project's own app; Qdrant runs embedded inside the
# backend process (vector_store.py's deliberate choice, see that file), not
# as a separate container. Embeddings are Voyage AI (hosted, see
# VOYAGE_API_KEY in backend/.env) rather than a local Ollama dependency, so
# there's no host-level service to reach from inside the container.
#
# First run: `docker compose up --build`, then POST /extract (via the
# Swagger UI at http://localhost:8000/docs, or the frontend's Extract page)
# to populate the index -- same as any fresh checkout, containerized or not.
# Needs DATABASE_URL set in backend/.env (Milestone 6.2) -- documents_db
# persists to Postgres now, not a bind-mounted JSON file.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/qdrant_data:/app/qdrant_data
      - ./backend/feedback_log.jsonl:/app/feedback_log.jsonl
      - ./backend/experiments_log.jsonl:/app/experiments_log.jsonl

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    env_file:
      - ./frontend/.env
    environment:
      # Reach the backend by its compose service name, not localhost --
      # "localhost" inside the frontend container means the frontend
      # container itself.
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
